name: build-windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Instala o Wails CLI v2.9.2 (mesma versão validada localmente).
      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.2
          wails version

      # CRÍTICO: popula frontend/dist/ antes de qualquer comando Go.
      # O `//go:embed all:frontend/dist` no main.go falha se o diretório
      # não existir (e o .gitignore o exclui do repo). Rodar o build do
      # Vite antes do go vet/test garante que o embed encontre arquivos.
      - name: Build frontend
        shell: pwsh
        working-directory: frontend
        run: npm ci

      - name: Build frontend dist
        shell: pwsh
        working-directory: frontend
        run: npm run build

      - name: go vet
        shell: pwsh
        run: go vet ./...

      - name: go test
        shell: pwsh
        run: go test ./...

      # Build de produção. -clean garante que não herda cache podre.
      - name: wails build
        shell: pwsh
        run: wails build -clean -platform windows/amd64

      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: facebook-responder-windows-amd64
          path: build/bin/facebook-responder.exe
          if-no-files-found: error
          retention-days: 14
